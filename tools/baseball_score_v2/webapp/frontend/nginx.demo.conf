server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API はバックエンドコンテナへ中継する（同一オリジンになるので CORS 設定は不要）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Vue Router（history モード）のためのフォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }
}
